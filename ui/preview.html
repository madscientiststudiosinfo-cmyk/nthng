<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app { width: 350px; height: 600px; background: #1e1e1e; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { padding: 20px; background: #2c2c2c; font-weight: bold; border-bottom: 1px solid #333; }
        .chat { flex: 1; padding: 20px; }
        .msg { background: #333; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">Nthgn (UI Preview)</div>
        <div class="chat">
            <div class="msg">Hello, secure messenger!</div>
            <div class="msg" style="text-align: right; background: #007bff;">End-to-end encrypted</div>
        </div>
    </div>
</body>
</html>
